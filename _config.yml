# _config.yml — GitHub Pages (deploy-from-branch)
# Por que existe: el cerebro documental NO es el sitio. Este repo mezcla la web publica con
# la memoria de trabajo (docs/, skills/, specs/, scripts/, _legacy/), y sin este fichero
# GitHub Pages las servia en abierto (CLAUDE.md, docs/*.md y scripts/*.mjs daban 200).
# Con Jekyll activo (sin .nojekyll) se aplica este `exclude` y ademas todo lo que empieza
# por `_` o `.` deja de publicarse. Los HTML del sitio NO tienen front matter, asi que
# Jekyll los copia tal cual: las paginas no cambian.
# OJO (Jekyll hace match por PREFIJO de cadena): los directorios llevan barra final a
# proposito — `scripts` sin barra tambien excluiria `scripts.js`, que SI es del sitio.
# NO excluir nunca: assets/ blog/ css/ data/ js/ multimedia/ og/ p/ portal/ snippets/
# ni style.css scripts.js service-worker.js manifest.json reviews.json robots.txt sitemap.xml

exclude:
  # --- cerebro documental y utillaje interno ---
  - CLAUDE.md
  - docs/
  - scripts/
  - skills/
  - specs/
  - _legacy/
  - hooks/
  - githooks/
  - tests/
  - tools/
  - backups/
  # --- codigo de servidor y config de deploy (no es la web) ---
  - functions/
  - firebase.json
  - database.rules.json
  - firestore.rules
  - firestore.indexes.json
  # --- toolchain de node ---
  - node_modules/
  - package.json
  - package-lock.json
  - bun.lock
  - biome.json
  - eslint.config.js
  # --- ruido de trabajo ---
  - README.md
  - "*.log"
  - "*.docx"
  - "*.xlsx"
