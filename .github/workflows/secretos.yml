name: secretos

# 🚨 EL ESCÁNER DE CREDENCIALES, SIN FILTRO DE PATHS (auditoría #18, N18-06).
#
# Este workflow existe porque los dos sitios donde corría el barrido tenían PREDICADO, y entre los
# dos dejaban un agujero medido: el hook de pre-commit solo lo disparaba si el commit tocaba `js/`,
# y `portal-ci.yml` solo corre si el push toca `portal/**`. 55 de los últimos 100 commits no tocan
# ninguno de los dos — o sea que más de la mitad de la historia reciente entró a un repositorio
# PÚBLICO sin que nadie mirara si traía una credencial. Un secreto en `functions/`, `scripts/`,
# `docs/` o la raíz pasaba limpio.
#
# Por eso aquí NO hay `paths:`. Todo push y todo PR, toquen lo que toquen.
#
# 🛡️ Y por eso está en CI además de en el hook: `core.hooksPath` vive en `.git/config` y NO se clona
# (§261, [[L-56]]). Un clon nuevo, otra máquina o un `--no-verify` y el hook deja de correr sin
# decirlo. Esto no se puede saltar.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secretos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  escaner:
    name: Credenciales en un repo público
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Sin `npm ci`: el escáner no tiene dependencias a propósito, así que falla en segundos
      # si tiene que fallar. Lista los ficheros con `git ls-files` sobre el checkout.
      - name: verify:secretos
        run: node scripts/verify-secretos.mjs
